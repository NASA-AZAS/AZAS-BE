name: azas-local
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Use --env-file docker/postgres.env}
    environment:
      POSTGRES_DB: azas
      POSTGRES_USER: azas_local
      POSTGRES_PASSWORD: azas_local_only
    ports: ['127.0.0.1:55432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U azas_local -d azas']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: azas-api:local
    build:
      context: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      AZAS_ENVIRONMENT: local
      # Containers reach the local database by service name, not the host's localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/azas?sslmode=disable
      SPRING_DATASOURCE_USERNAME: azas_local
      SPRING_DATASOURCE_PASSWORD: azas_local_only
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1
volumes:
  postgres-data: {}
