[project]
name = "azas-api"
version = "0.1.0"
description = "Lunar Landing Site Navigator backend API"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools", ".cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
