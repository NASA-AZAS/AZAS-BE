AWSTemplateFormatVersion: '2010-09-09'
Description: Private PostgreSQL and generated credentials for the AZAS hackathon

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets in at least two availability zones, in the app VPC
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RuntimeRoleName:
    Type: String
    Default: azas-be-ec2-runtime
  EngineVersion:
    Type: String
    Default: '17.11'
    AllowedPattern: '^17[.][0-9]+$'
  AvailabilityZone:
    Type: String
    Default: ap-northeast-2c
    AllowedValues: [ap-northeast-2a, ap-northeast-2b, ap-northeast-2c, ap-northeast-2d]

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: /azas/production/database
      Description: Generated AZAS database credentials; connection metadata attached by CloudFormation
      GenerateSecretString:
        SecretStringTemplate: '{"username":"azas_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accessible only from the AZAS app security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroupId

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Existing AZAS VPC subnets for a private RDS instance
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: azas-postgres
      DBName: azas
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      AvailabilityZone: !Ref AvailabilityZone
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'

  DatabaseConnection:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DatabaseSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

  ReadDatabaseSecret:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ReadAzasDatabaseSecret
      Roles: [!Ref RuntimeRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref DatabaseSecret

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
  DatabaseSecurityGroupId:
    Value: !GetAtt DatabaseSecurityGroup.GroupId
