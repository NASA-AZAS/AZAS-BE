server {
    listen 80;
    server_name api.azas.n-e.kr;

    # Keep HTTP-01 challenges reachable after HTTPS redirects are enabled.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.azas.n-e.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.azas.n-e.kr;

    ssl_certificate /etc/letsencrypt/live/api.azas.n-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.azas.n-e.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AZAS_SSL:10m;
    ssl_session_timeout 1d;

    location / {
        include /etc/nginx/snippets/azas-proxy.conf;
    }
}
