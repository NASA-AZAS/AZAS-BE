# Use before the first certificate is issued.
server {
    listen 80;
    server_name api.azas.kro.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/azas-proxy.conf;
    }
}
