name: azas

services:
  api:
    image: ${AZAS_API_IMAGE:?Set the SHA-tagged ECR image URI}
    restart: unless-stopped
    env_file: ${AZAS_APP_ENV_FILE:-/etc/azas/app.env}
    environment:
      # Only Nginx joins this backend network; api has no published host port.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Preserve proxy handling when rolling back to the previous FastAPI image.
      FORWARDED_ALLOW_IPS: '*'
    networks: [backend]
    mem_limit: 384m
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  nginx:
    image: nginx:stable-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    restart: unless-stopped
    ports: ['80:80', '443:443']
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ${AZAS_NGINX_CONFIG:-./nginx/azas-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/azas-proxy.conf:/etc/nginx/snippets/azas-proxy.conf:ro
      - ./nginx/azas-health.conf:/etc/nginx/conf.d/health.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/letsencrypt:ro
    mem_limit: 96m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD, wget, -q, -O-, 'http://127.0.0.1:8081/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  certbot:
    image: certbot/certbot@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    profiles: [tools]
    networks: [acme]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/letsencrypt
    mem_limit: 192m

networks:
  backend: {}
  acme: {}

volumes:
  letsencrypt: {}
  acme-webroot: {}
