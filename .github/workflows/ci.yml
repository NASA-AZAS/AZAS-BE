name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Java build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test with locked dependencies
        run: ./gradlew --no-daemon clean check bootJar

      - name: Check deployment scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

  docker:
    name: Docker build and smoke test
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag azas-api:ci .

      - name: Check container health endpoint
        run: |
          docker run --detach --name azas-api-ci --memory 384m --cpus 1 \
            --cap-drop ALL --security-opt no-new-privileges \
            --publish 127.0.0.1:8000:8000 azas-api:ci
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 2 --retry-max-time 150 --retry-all-errors --max-time 3 \
            http://127.0.0.1:8000/health

      - name: Check API schema and process isolation
        run: |
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/openapi.json | \
            jq --exit-status '.paths["/health"] and .info.title == "Lunar Landing Site Navigator API"'
          test "$(docker exec azas-api-ci id -u)" = 10001
          test "$(docker inspect --format '{{.State.OOMKilled}}' azas-api-ci)" = false
          docker stats --no-stream azas-api-ci

      - name: Test Compose HTTPS and proxy behavior
        run: bash scripts/test-nginx.sh

      - name: Test failed Compose deployment rollback
        run: bash scripts/test-compose-rollback.sh

      - name: Authenticate to AWS for main deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: azas-build-${{ github.run_id }}
          allowed-account-ids: "389930962915"

      - name: Publish tested image to ECR
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          registry="${ECR_REPOSITORY_URI%%/*}"
          image_uri="${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          if aws ecr describe-images --repository-name azas-api --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "The immutable image for this commit already exists; reusing it."
          else
            docker tag azas-api:ci "$image_uri"
            docker push "$image_uri"
          fi
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Show logs and clean up
        if: always()
        run: |
          if docker container inspect azas-api-ci > /dev/null 2>&1; then
            docker logs azas-api-ci
            docker rm --force azas-api-ci
          fi

  deploy:
    name: Deploy to EC2
    needs: [checks, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: azas-ec2-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: azas-deploy-${{ github.run_id }}
          allowed-account-ids: "389930962915"

      - name: Deploy through the restricted SSM document
        env:
          IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          DOCUMENT_NAME: ${{ vars.SSM_DOCUMENT_NAME }}
        run: |
          parameters=$(jq -cn --arg image "$IMAGE_URI" '{imageUri: [$image]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT_NAME" \
            --parameters "$parameters" \
            --comment "AZAS deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 130); do
            if result=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json 2>/dev/null); then
              status=$(jq -r .Status <<< "$result")
              case "$status" in
                Success)
                  jq -r .StandardOutputContent <<< "$result"
                  exit 0
                  ;;
                Pending|InProgress|Delayed) ;;
                *)
                  jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$result"
                  echo "Deployment failed with status: $status" >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 5
          done
          echo "Deployment timed out; check the SSM command above." >&2
          exit 1
