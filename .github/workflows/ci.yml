name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A docs push must not cancel an in-progress main deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Documentation and CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.plan.outputs.app }}
    steps:
      - name: Check out repository and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test CI policy
        run: python3 -m unittest discover -s scripts/ci -v

      - name: Check documentation links and code fences
        run: python3 scripts/ci/check_docs.py

      - name: Choose app CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/plan.py

  checks:
    name: Java build and test
    needs: plan
    # Preserve the existing required check and fail if planning/docs checks fail.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful CI plan and documentation checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success

      - name: Documentation-only run
        if: needs.plan.outputs.app != 'true'
        run: echo 'No app checks needed; documentation and CI policy checks passed.'

      - name: Check out repository
        if: needs.plan.outputs.app == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        if: needs.plan.outputs.app == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        if: needs.plan.outputs.app == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test with locked dependencies
        if: needs.plan.outputs.app == 'true'
        run: ./gradlew --no-daemon clean check bootJar

      - name: Check local run script syntax
        if: needs.plan.outputs.app == 'true'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/run-local.ps1", [ref]$tokens, [ref]$parseErrors) > $null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

  docker:
    name: Docker build and smoke test
    needs: [plan, checks]
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag azas-api:ci .

      - name: Check local PostgreSQL Compose
        run: |
          docker compose --env-file docker/postgres.env --file compose.local.yaml config --quiet
          docker compose --env-file docker/postgres.env --file compose.local.yaml \
            up --detach --wait --wait-timeout 90 postgres
          docker compose --env-file docker/postgres.env --file compose.local.yaml \
            exec -T postgres psql -U azas_local -d azas --set ON_ERROR_STOP=1 --command 'SELECT 1'
          docker compose --env-file docker/postgres.env --file compose.local.yaml down --volumes

      - name: Check container health endpoint
        run: |
          source docker/postgres.env
          docker network create azas-smoke
          docker run --detach --name azas-postgres-ci --network azas-smoke --network-alias postgres \
            --env POSTGRES_DB=azas --env POSTGRES_USER=azas_test --env POSTGRES_PASSWORD=test_only_password \
            "$POSTGRES_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec azas-postgres-ci pg_isready -U azas_test -d azas; then break; fi
            sleep 1
          done
          docker run --detach --name azas-api-ci --memory 384m --cpus 1 \
            --cap-drop ALL --security-opt no-new-privileges \
            --network azas-smoke \
            --env 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/azas?sslmode=disable' \
            --env SPRING_DATASOURCE_USERNAME=azas_test --env SPRING_DATASOURCE_PASSWORD=test_only_password \
            --publish 127.0.0.1:8000:8000 azas-api:ci
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 2 --retry-max-time 150 --retry-all-errors --max-time 3 \
            http://127.0.0.1:8000/health
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8000/actuator/health/readiness | jq --exit-status '.status == "UP"'

      - name: Check API schema and process isolation
        run: |
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/openapi.json | \
            jq --exit-status '.paths["/health"] and .info.title == "Lunar Landing Site Navigator API"'
          test "$(docker exec azas-api-ci id -u)" = 10001
          test "$(docker inspect --format '{{.State.OOMKilled}}' azas-api-ci)" = false
          docker exec azas-api-ci test -r /app/certs/rds-ca-bundle.crt
          test "$(docker exec azas-api-ci sha256sum /app/certs/rds-ca-bundle.crt | cut -d ' ' -f 1)" = \
            "$(sha256sum docker/certs/rds-ca-bundle.crt | cut -d ' ' -f 1)"
          docker stats --no-stream azas-api-ci

      - name: Check text request logging
        run: |
          curl --fail --silent --show-error --max-time 15 --dump-header /tmp/text-request.headers \
            --output /tmp/text-request.json --header 'Authorization: Bearer ci-text-private-marker' \
            'http://127.0.0.1:8000/openapi.json?token=ci-text-private-marker'
          request_id=$(awk 'tolower($1)=="x-request-id:" {gsub("\r", "", $2); print $2}' /tmp/text-request.headers)
          [[ "$request_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          for attempt in $(seq 1 10); do
            output=$(docker logs azas-api-ci 2>&1)
            [[ "$output" != *ci-text-private-marker* ]]
            if line=$(grep -F "$request_id" <<< "$output" | grep -F 'HTTP request completed'); then
              test "$(wc -l <<< "$line")" = 1
              grep -Eq 'status="?200"?' <<< "$line"
              grep -Fq '/openapi.json' <<< "$line"
              break
            fi
            sleep 1
          done
          test -n "${line:-}"

      - name: Check database-aware readiness and recovery
        run: |
          docker stop azas-postgres-ci
          test "$(curl --silent --show-error --max-time 15 --output /tmp/readiness.json \
            --write-out '%{http_code}' http://127.0.0.1:8000/actuator/health/readiness)" = 503
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8000/health
          docker start azas-postgres-ci
          curl --fail --silent --show-error --max-time 10 --retry 20 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8000/actuator/health/readiness | jq --exit-status '.status == "UP"'

      - name: Check JSON request logging
        run: |
          docker run --detach --name azas-api-json-ci --memory 384m --cpus 1 \
            --cap-drop ALL --security-opt no-new-privileges --network azas-smoke \
            --env 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/azas?sslmode=disable' \
            --env SPRING_DATASOURCE_USERNAME=azas_test --env SPRING_DATASOURCE_PASSWORD=test_only_password \
            --env AZAS_LOG_FORMAT=logstash --publish 127.0.0.1:8001:8000 azas-api:ci
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors \
            --retry-max-time 150 --max-time 3 http://127.0.0.1:8001/actuator/health/readiness
          curl --fail --silent --show-error --max-time 15 --dump-header /tmp/json-request.headers \
            --output /tmp/json-request.json 'http://127.0.0.1:8001/openapi.json?token=ci-json-private-marker'
          request_id=$(awk 'tolower($1)=="x-request-id:" {gsub("\r", "", $2); print $2}' /tmp/json-request.headers)
          [[ "$request_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          verified=false
          for attempt in $(seq 1 10); do
            output=$(docker logs azas-api-json-ci 2>&1)
            [[ "$output" != *ci-json-private-marker* ]]
            if jq --raw-input --slurp --exit-status --arg id "$request_id" '
              [split("\n")[] | fromjson? |
                select(.message == "HTTP request completed" and .requestId == $id)] as $requests |
              ($requests | length) == 1 and $requests[0].method == "GET" and
              $requests[0].path == "/openapi.json" and $requests[0].status == 200 and
              ($requests[0].durationMs | type == "number")' <<< "$output"; then
              verified=true
              break
            fi
            sleep 1
          done
          [[ "$verified" == true ]]
          test "$(docker inspect --format '{{.State.OOMKilled}}' azas-api-json-ci)" = false

      - name: Authenticate to AWS for main deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: azas-build-${{ github.run_id }}
          allowed-account-ids: "389930962915"

      - name: Publish tested image to ECR
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          registry="${ECR_REPOSITORY_URI%%/*}"
          image_uri="${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          if aws ecr describe-images --repository-name azas-api --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "The immutable image for this commit already exists; reusing it."
          else
            docker tag azas-api:ci "$image_uri"
            docker push "$image_uri"
          fi
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Show logs and clean up
        if: always()
        run: |
          if docker container inspect azas-api-ci > /dev/null 2>&1; then
            docker logs azas-api-ci
            docker rm --force azas-api-ci
          fi
          if docker container inspect azas-api-json-ci > /dev/null 2>&1; then
            docker logs azas-api-json-ci
            docker rm --force azas-api-json-ci
          fi
          docker rm --force azas-postgres-ci 2>/dev/null || true
          docker network rm azas-smoke 2>/dev/null || true
          docker compose --env-file docker/postgres.env --file compose.local.yaml down --volumes

  deploy:
    name: Deploy to EC2
    needs: [plan, checks, docker]
    if: needs.plan.outputs.app == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: azas-ec2-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: azas-deploy-${{ github.run_id }}
          allowed-account-ids: "389930962915"

      - name: Deploy through the restricted SSM document
        env:
          IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          DOCUMENT_NAME: ${{ vars.SSM_DOCUMENT_NAME }}
        run: |
          parameters=$(jq -cn --arg image "$IMAGE_URI" '{imageUri: [$image]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT_NAME" \
            --parameters "$parameters" \
            --comment "AZAS deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 130); do
            if result=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json 2>/dev/null); then
              status=$(jq -r .Status <<< "$result")
              case "$status" in
                Success)
                  jq -r .StandardOutputContent <<< "$result"
                  exit 0
                  ;;
                Pending|InProgress|Delayed) ;;
                *)
                  jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$result"
                  echo "Deployment failed with status: $status" >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 5
          done
          echo "Deployment timed out; check the SSM command above." >&2
          exit 1
