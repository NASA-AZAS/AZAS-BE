name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync pytest -W error

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag azas-api:ci .

      - name: Check container health endpoint
        run: |
          docker run --detach --name azas-api-ci --publish 127.0.0.1:8000:8000 azas-api:ci
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 1 --retry-max-time 45 --retry-all-errors --max-time 3 \
            http://127.0.0.1:8000/health

      - name: Show logs and clean up
        if: always()
        run: |
          if docker container inspect azas-api-ci > /dev/null 2>&1; then
            docker logs azas-api-ci
            docker rm --force azas-api-ci
          fi
