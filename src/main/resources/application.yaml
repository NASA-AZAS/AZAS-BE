spring:
  application:
    name: azas
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 5000
      initialization-fail-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8000
  shutdown: graceful
  # Production traffic reaches the API only through Nginx, which overwrites these headers.
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 25
      min-spare: 2
    max-connections: 256
    accept-count: 50

azas:
  app-name: ${AZAS_APP_NAME:Lunar Landing Site Navigator API}
  environment: ${AZAS_ENVIRONMENT:local}
  cors-origins: ${AZAS_CORS_ORIGINS:[]}
  request-logging:
    slow-request-ms: ${AZAS_SLOW_REQUEST_MS:1000}

logging:
  level:
    azas: ${AZAS_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%thread] [requestId=%X{requestId:-}] %logger{36} : %msg %kvp%n%wEx"
  structured:
    format:
      console: ${AZAS_LOG_FORMAT:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
